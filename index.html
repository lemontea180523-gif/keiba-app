<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>競馬AI 今日の★★</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* 出馬表の紙と芝の緑。数字は等幅で縦にそろえ、印(★★・軸)だけ色で目立たせる */
  --paper: #f4f3ee;
  --card: #ffffff;
  --ink: #1d2420;
  --muted: #66706a;
  --line: #dcdcd2;
  --turf: #1f6b47;
  --turf-soft: #e3efe7;
  --gold: #b7791f;
  --gold-soft: #fbf0dc;
  --good: #1f6b47;
  --bad: #b3412f;
  /* 脚質の色:前に行くほど暖色、後ろほど寒色 */
  --s0: #c2412d; --s1: #c98a1b; --s2: #3f8f5f; --s3: #3d6fb0;
  --display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121614; --card: #1a201d; --ink: #e7ebe8; --muted: #9aa49e; --line: #2c3430;
    --turf: #5cc48e; --turf-soft: #1c2f25; --gold: #e2a84a; --gold-soft: #33291a;
    --good: #5cc48e; --bad: #ef8a76; color-scheme: dark;
    --s0: #ef7f68; --s1: #e8b04f; --s2: #6cc893; --s3: #7aa6e6;
  }
}
:root[data-theme="dark"] {
  --paper: #121614; --card: #1a201d; --ink: #e7ebe8; --muted: #9aa49e; --line: #2c3430;
  --turf: #5cc48e; --turf-soft: #1c2f25; --gold: #e2a84a; --gold-soft: #33291a;
  --good: #5cc48e; --bad: #ef8a76; color-scheme: dark;
  --s0: #ef7f68; --s1: #e8b04f; --s2: #6cc893; --s3: #7aa6e6;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 860px; margin: 0 auto; padding: 16px 16px 48px; display: grid; gap: 16px; }
h1 { font-family: var(--display); font-weight: 900; font-size: 22px; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 700; font-size: 17px; margin: 0; text-wrap: balance; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); font-size: 13px; }
header { display: grid; gap: 8px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select, .filebtn {
  font: inherit; font-size: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 8px 12px; cursor: pointer;
}
button.primary { background: var(--turf); color: #fff; border-color: var(--turf); font-weight: 700; }
:root[data-theme="dark"] button.primary { color: #0f1612; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #0f1612; } }
button:focus-visible, select:focus-visible, .filebtn:focus-within, .race:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.chip.ww { background: var(--gold-soft); color: var(--gold); }
.chip.ax { background: var(--turf-soft); color: var(--turf); }
.chip.jump { background: var(--line); color: var(--muted); }
.status { padding: 10px 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); font-size: 13px; }
.status.err { border-color: var(--bad); color: var(--bad); }
.list { display: grid; gap: 8px; }
.race {
  display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%;
}
.race.has { border-left-color: var(--gold); }
.race.sel { border-color: var(--turf); border-left-color: var(--turf); }
.race .t { font-family: var(--mono); font-weight: 600; font-size: 15px; }
.race .n { display: grid; gap: 2px; min-width: 0; }
.race .n b { font-family: var(--display); font-size: 15px; }
.race .n span { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.race .r { display: grid; justify-items: end; gap: 2px; font-size: 12px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 14px; }
.tblwrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.l, th.l { text-align: left; }
tr.isax td { background: var(--turf-soft); }
tr.isww td { background: var(--gold-soft); }
.meter { display: inline-block; height: 6px; border-radius: 3px; background: var(--turf); vertical-align: middle; margin-left: 6px; }
.simbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 2px; }
.tile .v { font-family: var(--mono); font-size: 22px; font-weight: 600; }
.tile .k { color: var(--muted); font-size: 12px; }
.good { color: var(--good); }
.bad { color: var(--bad); }
.once { font-family: var(--mono); font-size: 18px; font-weight: 600; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--line); }
.hist { display: grid; gap: 4px; font-size: 13px; }
.chip.hit { background: var(--turf-soft); color: var(--good); }
.chip.miss { background: var(--line); color: var(--muted); }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.result { border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.result.win { border-left-color: var(--good); }
.podium { font-family: var(--mono); font-size: 16px; font-weight: 600; display: grid; gap: 2px; }
textarea { width: 100%; min-height: 70px; font: 12px var(--mono); background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
input[type="file"] { position: absolute; opacity: 0; width: 1px; height: 1px; }

/* ---------- 脚質と展開 ---------- */
.st { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: 12px; font-weight: 900; color: #fff; }
.st.s0 { background: var(--s0); } .st.s1 { background: var(--s1); } .st.s2 { background: var(--s2); } .st.s3 { background: var(--s3); }
.st.sx { background: var(--line); color: var(--muted); }
:root[data-theme="dark"] .st:not(.sx) { color: #10140f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .st:not(.sx) { color: #10140f; } }
.stbar { display: inline-flex; width: 64px; height: 8px; border-radius: 4px; overflow: hidden; vertical-align: middle; margin-left: 6px; background: var(--line); gap: 1px; }
.stbar i { display: block; height: 100%; }
.stbar i.s0 { background: var(--s0); } .stbar i.s1 { background: var(--s1); } .stbar i.s2 { background: var(--s2); } .stbar i.s3 { background: var(--s3); }
.tenkai { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.tenkai .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
.pace { font-family: var(--display); font-weight: 900; font-size: 16px; }
.pace.hi { color: var(--s0); } .pace.mid { color: var(--ink); } .pace.slow { color: var(--s3); }
.formation { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.fcol { border-radius: 8px; background: var(--paper); padding: 6px; display: grid; align-content: start; gap: 6px; min-height: 64px; }
.fcol .fh { font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; gap: 4px; }
.fcol .fh .c0 { color: var(--s0); } .fcol .fh .c1 { color: var(--s1); } .fcol .fh .c2 { color: var(--s2); } .fcol .fh .c3 { color: var(--s3); }
.fhorses { display: flex; flex-wrap: wrap; gap: 4px; }
.uma { font-family: var(--mono); font-size: 13px; font-weight: 600; min-width: 26px; height: 26px; padding: 0 4px; border-radius: 6px; display: inline-grid; place-items: center;
  background: var(--card); border: 1px solid var(--line); }
.uma.ax { background: var(--turf); color: #fff; border-color: var(--turf); }
.uma.ww { background: var(--gold); color: #fff; border-color: var(--gold); }
:root[data-theme="dark"] .uma.ax, :root[data-theme="dark"] .uma.ww { color: #10140f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .uma.ax, :root:not([data-theme="light"]) .uma.ww { color: #10140f; } }
.adv { font-family: var(--mono); font-size: 12px; }
.arrow { font-size: 11px; color: var(--muted); text-align: center; letter-spacing: .1em; }
.tk { font-weight: 700; font-size: 12px; }
.tk.up { color: var(--good); } .tk.dn { color: var(--bad); }
/* 荒れ指数:1(堅い)は緑、5(大荒れ)は赤 */
.are { display: inline-block; font-weight: 700; font-size: 12px; padding: 0 6px; border-radius: 999px; white-space: nowrap; }
.aredist { display: grid; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.arebar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); }
.arebar i { display: block; height: 100%; }
.are.a1 { background: var(--turf-soft); color: var(--good); } .are.a2 { background: var(--turf-soft); color: var(--muted); }
.are.a3 { background: var(--line); color: var(--ink); } .are.a4 { background: var(--gold-soft); color: var(--gold); } .are.a5 { background: var(--gold-soft); color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* 展開シミュレーション */
.tsim { display: grid; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tsim .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.tsbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tsbar .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tsbar .seg button { border: 0; border-radius: 0; padding: 8px 10px; }
.tsbar .seg button + button { border-left: 1px solid var(--line); }
.tsbar .seg button.on { background: var(--turf); color: #fff; font-weight: 700; }
.tsstage { display: grid; grid-template-columns: minmax(160px, 260px) 1fr; gap: 10px; align-items: center; }
.tsstage svg { width: 100%; height: auto; }
.tsphase { font-family: var(--display); font-weight: 900; font-size: 22px; }
.tsstrip { width: 100%; height: auto; background: var(--turf-soft); border-radius: 8px; }
.tslab { font-size: 9px; fill: var(--muted); font-family: var(--body); }
.tsstrip .tslab { font-size: 11px; }
.tsnum { font-size: 10px; font-weight: 700; font-family: var(--mono); }
.tsrank { font-size: 11px; font-weight: 900; fill: var(--gold); font-family: var(--body); }
.tsrows { display: grid; gap: 4px; font-size: 13px; }
.tsrows .k { display: inline-block; min-width: 7em; color: var(--muted); }
/* 横に長い表でページ全体が広がらないように(スマホで拡大されたまま戻らなくなるのを防ぐ) */
.panel > *, .tsim, .tsim > * { min-width: 0; }
#tsTable { overflow-x: auto; }
@media (max-width: 520px) { .tsstage { grid-template-columns: 1fr; } .tsphase { font-size: 18px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>競馬AI 今日の★★</h1>
    <div class="muted" id="meta">読み込み中…</div>
    <div class="bar">
      <button class="primary" id="btnDrive" type="button">最新を読み込む</button>
      <label class="filebtn" for="fileIn">ファイルを選ぶ<input type="file" id="fileIn" accept=".txt,.json,text/plain,application/json"></label>
      <select id="filter" aria-label="表示するレース">
        <option value="ww">★★のレースだけ</option>
        <option value="nerai">◎狙い目だけ</option>
        <option value="kn">◎消し狙いだけ</option>
        <option value="all">全レース</option>
      </select>
    </div>
    <div class="status" id="status" hidden></div>
  </header>

  <section class="summary" id="summary" hidden aria-label="その日の収支"></section>

  <section class="panel" id="nerai" hidden aria-label="狙い目ごとの収支"></section>

  <section class="list" id="list" aria-label="レースの一覧"></section>

  <section class="panel" id="detail" hidden></section>

  <details>
    <summary>読み込めないとき</summary>
    <div style="display:grid;gap:8px;margin-top:8px">
      <div class="muted">このページは、Colabで「予想」「予想し直す」「答え合わせ」を押すたびに自動で新しくなります(開いている間は2分ごとに読み直します)。読み込めないときは、keiba_app_latest.txt の中身を下に貼り付けても読み込めます。</div>
      <textarea id="pasteIn" aria-label="予想の中身を貼り付け" placeholder='{"date": "2026-11-22", "races": [...]}'></textarea>
      <div><button type="button" id="btnPaste">貼り付けた中身を読み込む</button></div>
    </div>
  </details>
</div>

<script>
// ---------- 見本(Driveから読み込むまでの表示用) ----------
const SAMPLE = (() => {
  const mk = (u, name, odds, pw, p3, mark, st, sr) => ({ u, name, odds, pop: null, pw, p3, mark, st, sr });
  return {
    date: "見本", made: "見本データ", l2: 0.81, l3: 0.65, sample: true,
    races: [{
      id: "sample1", venue: "福島", no: 2, name: "3歳以上1勝クラス(見本)", post: "10:15", surface: "ダート", distance: 1150,
      axis: 11, himo: [12], third: [5, 6, 8, 9, 13, 14, 15, 16], going: "良",
      pace: { nige: 2, front: 6, known: 16 },
      cadv: [0.061, 0.024, -0.012, -0.035], gadv: [0.048, 0.019, -0.006, -0.03],
      combos: [5, 6, 8, 9, 13, 14, 15, 16].map(c => ({ c: [11, 12, c].sort((a, b) => a - b), odds: null })),
      result: { order: [11, 3, 12], fin: { 11: 1, 3: 2, 12: 3 }, pay: { "三連複": [{ nums: [3, 11, 12], yen: 4870 }], "単勝": [{ nums: [11], yen: 310 }] }, cost: 800, ret: 0 },
      horses: [
        mk(1, "見本ホース1", 45.0, .02, .09, "", 3, [0, 0, .2, .8]), mk(2, "見本ホース2", 80.1, .012, .06, "✕", 2, [0, .2, .6, .2]),
        mk(3, "見本ホース3", 6.8, .11, .33, "", 0, [.6, .4, 0, 0]), mk(4, "見本ホース4", 120.5, .008, .04, "", 3, [0, 0, 0, 1]),
        mk(5, "見本ホース5", 9.4, .08, .27, "", 1, [0, .8, .2, 0]), mk(6, "見本ホース6", 12.0, .06, .22, "", 2, [0, .2, .6, .2]),
        mk(7, "見本ホース7", 60.3, .015, .07, "", 3, [0, 0, .4, .6]), mk(8, "見本ホース8", 7.5, .10, .30, "", 1, [.2, .6, .2, 0]),
        mk(9, "見本ホース9", 25.2, .035, .16, "", 2, [0, .4, .6, 0]), mk(10, "見本ホース10", 98.0, .01, .05, "", 3, [0, 0, .2, .8]),
        mk(11, "見本ホース11", 3.1, .24, .58, "", 1, [.2, .8, 0, 0]), mk(12, "見本ホース12", 17.8, .045, .19, "★★", 0, [.4, .4, .2, 0]),
        mk(13, "見本ホース13", 14.6, .05, .20, "", 2, [0, 0, .8, .2]), mk(14, "見本ホース14", 33.0, .03, .15, "", 1, [0, .6, .4, 0]),
        mk(15, "見本ホース15", 21.4, .04, .17, "", 2, [0, .2, .6, .2]), mk(16, "見本ホース16", 38.7, .025, .15, "", 3, [0, 0, .2, .8])
      ]
    }]
  };
})();

// 見本のオッズ(本物ではありません。表示を試すための作り物)
(() => {
  const r = SAMPLE.races[0], hs = r.horses, n = hs.length;
  const pw = hs.map(h => h.pw), t = pw.reduce((a, b) => a + b, 0), q = pw.map(v => v / t);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  r.uo = {}; r.so = {};
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const p = q[i] * q[j] / (1 - q[i]) + q[j] * q[i] / (1 - q[j]);
    r.uo[hs[i].u + "-" + hs[j].u] = Math.max(1.5, Math.round(0.775 / p * (0.7 + rnd() * 0.6) * 10) / 10);
    for (let k = j + 1; k < n; k++) {
      const p3 = (q[i] * q[j] * q[k]) * 6 / ((1 - q[i]) * (1 - q[i] - q[j]));
      r.so[[hs[i].u, hs[j].u, hs[k].u].sort((a, b) => a - b).join("-")] = Math.max(2, Math.round(0.725 / p3 * (0.7 + rnd() * 0.6) * 10) / 10);
    }
  }
  r.combos.forEach(c => { c.odds = r.so[c.c.join("-")] || null; });
})();

let DATA = null, SEL = null;
const HIST = {};
const $ = id => document.getElementById(id);
const pct = (x, d = 1) => (x == null || isNaN(x)) ? "-" : (x * 100).toFixed(d) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STN = ["逃げ", "先行", "差し", "追込"];
const STS = ["逃", "先", "差", "追"];

function status(msg, err) {
  const s = $("status");
  if (!msg) { s.hidden = true; return; }
  s.hidden = false; s.textContent = msg; s.className = "status" + (err ? " err" : "");
}

// ---------- 読み込み ----------
function findJson(x) {
  if (x == null) return null;
  if (typeof x === "string") {
    // Driveの読み取りは [ ] の前に \ を付けて返すことがあるので、JSONで使わない「\+文字」を元に戻す
    x = x.replace(/\\([^"\\\/bfnrtu])/g, "$1");
    const i = x.indexOf('{"date"');
    if (i >= 0) {
      const j = x.lastIndexOf("}");
      try { return JSON.parse(x.slice(i, j + 1)); } catch (e) {}
    }
    try { const o = JSON.parse(x); return findJson(o); } catch (e) { return null; }
  }
  if (typeof x === "object") {
    if (Array.isArray(x.races) && x.date) return x;
    for (const v of Object.values(x)) { const r = findJson(v); if (r) return r; }
  }
  return null;
}
function findFileId(x) {
  if (x == null) return null;
  if (typeof x === "string") {
    const m = x.match(/"id"\s*:\s*"([\w-]{20,})"[^{}]*?"title"\s*:\s*"keiba_app_latest\.txt"/) ||
              x.match(/"title"\s*:\s*"keiba_app_latest\.txt"[^{}]*?"id"\s*:\s*"([\w-]{20,})"/);
    if (m) return m[1];
    try { return findFileId(JSON.parse(x)); } catch (e) { return null; }
  }
  if (typeof x === "object") {
    if ((x.title === "keiba_app_latest.txt" || x.name === "keiba_app_latest.txt") && x.id) return x.id;
    for (const v of Object.values(x)) { const r = findFileId(v); if (r) return r; }
  }
  return null;
}
function setData(d, from) {
  if (!d || !Array.isArray(d.races)) { status("中身が読めませんでした。keiba_app_latest.txt の中身かどうか確かめてください", true); return; }
  DATA = d; SEL = null;
  if (!d.sample) { try { localStorage.setItem("keiba_app_data", JSON.stringify(d)); } catch (e) {} }
  status(from ? from : "");
  render();
}
async function loadDrive() {
  // GitHubに置いた data/latest.json を読む(Driveにはつながない)
  const btn = $("btnDrive");
  btn.disabled = true; status("最新の予想を読み込んでいます…");
  try {
    const r = await fetch(`data/latest.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) { status(`予想のファイルがまだありません(${r.status})。Colabで「予想」を押すと置かれます`, true); return; }
    const d = findJson(await r.text());
    if (!d) { status("予想のファイルが読めませんでした", true); return; }
    const keep = SEL;
    setData(d, `最新を読み込みました(${d.made} に作った予想)`);
    if (keep && d.races.some(x => x.id === keep)) { SEL = keep; render(); }
  } catch (e) {
    status("読み込めませんでした。通信を確かめて、もう一度押してください", true);
  } finally { btn.disabled = false; }
}

// ---------- 展開の予想(逃げ・先行の頭数から出す目安) ----------
function paceOf(r) {
  const p = r.pace;
  if (!p || p.known == null || !p.known) return null;
  const share = p.front / p.known;
  if (p.nige >= 2 || share >= 0.42) return { cls: "hi", label: "ハイペース寄り", short: "H", share };
  if (p.nige === 0 && share < 0.25) return { cls: "slow", label: "スロー寄り", short: "S", share };
  if (p.nige === 0 || share < 0.3) return { cls: "slow", label: "平均〜スロー", short: "M", share };
  return { cls: "mid", label: "平均ペース", short: "M", share };
}

// ---------- 結果 ----------
// 買い方D(消し条件なし → 馬連 1番人気-★★)。古いファイルには umaren がない
function um(r) { return r.umaren || []; }
// 不良馬場(㊺・㊻):★★がないレースでも、10〜50倍の馬は人気より来やすい(倍率1.1〜1.2)。回収率はトントンなので参考の目印
function furyo(r) { return r.going === "不良"; }
function furyoPick(r, h) { return furyo(r) && h.odds != null && h.odds >= 10 && h.odds <= 50 && h.ti != null && h.ti >= 0.18 && h.ti <= 0.465; }
function isBuy(r) { return r.combos.length > 0 || um(r).length > 0; }
const yen = v => "¥" + Math.round(v).toLocaleString();
function resChip(r) {
  const R = r.result;
  if (!R) return "";
  const o = `<span class="num muted">${R.order.join("-")}</span>`;
  if (!isBuy(r)) return o;
  return (R.ret > 0 ? `<span class="chip hit">的中 ${yen(R.ret)}</span>` : `<span class="chip miss">外れ</span>`) + o;
}
function renderSummary(bought) {
  const S = $("summary");
  const done = bought.filter(r => r.result);
  if (!done.length) { S.hidden = true; return; }
  const cost = done.reduce((s, r) => s + r.result.cost, 0), ret = done.reduce((s, r) => s + r.result.ret, 0);
  const hits = done.filter(r => r.result.ret > 0).length;
  S.hidden = false;
  S.innerHTML = [
    ["結果が出たレース", `${done.length} / ${bought.length}`, ""],
    ["的中", `${hits}レース`, hits ? "good" : ""],
    ["購入", yen(cost), ""],
    ["払い戻し", yen(ret), ret >= cost ? "good" : "bad"],
    ["回収率", cost ? Math.round(ret / cost * 100) + "%" : "-", ret >= cost ? "good" : "bad"],
  ].map(([k, v, c]) => `<div class="tile"><span class="k">${k}</span><span class="v ${c}" style="font-size:18px">${v}</span></div>`).join("");
}
// ---------- 狙い目ごとの収支(今日 / これまで) ----------
let NV = "today";
function neraiOf(r) {
  if ("nerai" in r) return { nerai: r.nerai || "", chui: r.chui || "" };
  const od = r.horses.map(h => h.odds).filter(v => v);
  const fav = od.length ? Math.min(...od) : null;
  const mo = r.himo.map(u => (r.horses.find(h => h.u === u) || {}).odds).filter(v => v);
  const m = mo.length ? mo.reduce((a, b) => a + b, 0) / mo.length : null;
  const chui = [r.venue === "小倉" ? "小倉" : "", r.going === "重" ? "重馬場" : ""].filter(Boolean).join("・");
  return { nerai: fav != null && fav >= 1.9 && fav <= 3.2 && m != null && m <= 30 ? "狙い目" : "", chui };
}
function todayRows(d) {
  const rows = [];
  for (const r of d.races) {
    const R = r.result;
    if (!R || !isBuy(r)) continue;
    const pay = R.pay || {};
    const key = a => [...a].sort((x, y) => x - y).join("-");
    const p3 = Object.fromEntries((pay["三連複"] || []).map(x => [key(x.nums), x.yen]));
    const pw = Object.fromEntries((pay["ワイド"] || []).map(x => [key(x.nums), x.yen]));
    const p1 = Object.fromEntries((pay["複勝"] || []).map(x => [String(x.nums[0]), x.yen]));
    const pu = Object.fromEntries((pay["馬連"] || []).map(x => [key(x.nums), x.yen]));
    const w = r.wide || [], f = r.fuku || [], nr = neraiOf(r);
    rows.push({ "買い方": r.combos.length ? "C" : "D", "馬連_購入": um(r).length * 100, "馬連_払戻": um(r).reduce((s, x) => s + (pu[key(x)] || 0), 0),
      "狙い目": nr.nerai ? "狙い目" : "それ以外", "注意": nr.chui, "2列目": r.label || "★★", "消し狙い": r.kn ? "消し狙い" : "", "消し": r.keshi || "",
      "三連複_購入": r.combos.length * 100, "三連複_払戻": r.combos.reduce((s, c) => s + (p3[key(c.c)] || 0), 0),
      "ワイド_購入": w.length * 100, "ワイド_払戻": w.reduce((s, x) => s + (pw[key(x)] || 0), 0),
      "複勝_購入": f.length * 100, "複勝_払戻": f.reduce((s, u) => s + (p1[String(u)] || 0), 0) });
  }
  return rows;
}
function renderNerai(d) {
  const P = $("nerai");
  const rows = NV === "today" ? todayRows(d) : (d.kiroku || []);
  if (!todayRows(d).length && !(d.kiroku || []).length) { P.hidden = true; return; }
  P.hidden = false;
  const num = v => +v || 0;
  const summ = (rs, label) => {
    const buy = rs.reduce((s, x) => s + num(x["三連複_購入"]) + num(x["ワイド_購入"]) + num(x["複勝_購入"]) + num(x["馬連_購入"]), 0);
    const ret = rs.reduce((s, x) => s + num(x["三連複_払戻"]) + num(x["ワイド_払戻"]) + num(x["複勝_払戻"]) + num(x["馬連_払戻"]), 0);
    const hit = rs.filter(x => num(x["三連複_払戻"]) + num(x["ワイド_払戻"]) + num(x["複勝_払戻"]) + num(x["馬連_払戻"]) > 0).length;
    const part = k => { const b = rs.reduce((s, x) => s + num(x[k + "_購入"]), 0), r = rs.reduce((s, x) => s + num(x[k + "_払戻"]), 0); return b ? Math.round(r / b * 100) + "%" : "-"; };
    return { label, n: rs.length, hit, buy, ret, roi: buy ? Math.round(ret / buy * 100) : null, sf: part("三連複"), wd: part("ワイド"), fk: part("複勝"), um: part("馬連") };

  const isD = x => x["買い方"] === "D";

    summ(rc.filter(x => x["狙い目"] !== "狙い目"), "それ以外"), summ(rows.filter(x => x["注意"]), "注意(小倉・重馬場)"),
    summ(rows.filter(x => x["2列目"] === "芝印"), "芝印のレース"),
    summ(rows.filter(x => x["消し狙い"] === "消し狙い"), "◎消し狙い"),
    summ(rows.filter(x => x["消し狙い"] !== "消し狙い" && x["消し"]), "それ以外の消しのレース")].filter(g => g.n || g.label === "全部");
  const days = NV === "all" ? new Set((d.kiroku || []).map(x => x["日付"])).size : 1;
  const btn = (v, l) => `<button type="button" class="${NV === v ? "primary" : ""}" data-nv="${v}" style="padding:6px 10px">${l}</button>`;
  P.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between">
      <h2>狙い目ごとの収支</h2><div class="simbar">${btn("today", "今日")}${btn("all", "これまで")}</div></div>
    <div class="muted">${NV === "today" ? "今日の結果が出たレース(買い方C:三連複+ワイド+複勝 / 買い方D:馬連・100円ずつ)" : `これまでの記録(${days}日分・答え合わせのたびにたまります)`}</div>
    ${rows.length ? `<div class="tblwrap"><table><thead><tr><th class="l">分け方</th><th>レース</th><th>的中</th><th>購入</th><th>払い戻し</th><th>回収率</th><th>三連複</th><th>ワイド</th><th>複勝</th><th>馬連</th></tr></thead><tbody>
      ${groups.map(g => `<tr><td class="l">${g.label}</td><td class="num">${g.n}</td><td class="num">${g.hit}</td><td class="num">${yen(g.buy)}</td><td class="num">${yen(g.ret)}</td>
        <td class="num ${g.roi == null ? "" : g.roi >= 100 ? "good" : "bad"}"><b>${g.roi == null ? "-" : g.roi + "%"}</b></td><td class="num muted">${g.sf}</td><td class="num muted">${g.wd}</td><td class="num muted">${g.fk}</td><td class="num muted">${g.um}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="muted">${NV === "today" ? "今日はまだ結果が出たレースがありません。Colabで「答え合わせ」を押してから読み込み直してください" : "まだ記録がありません。「答え合わせ」を押すとたまっていきます"}</div>`}
    <div class="muted">狙い目 = 1番人気1.9〜3.2倍・印の単勝が平均30倍以下(3年半で回収率130%前後)。買い方D = 消し条件なしのレースで馬連 1番人気-★★(3年半で135%)。狙い目・注意などの分け方は買い方Cのレースだけで数えます。数十レースたまるまでは、当たり外れで大きく上下します。</div>`;
  P.querySelectorAll("button[data-nv]").forEach(b => b.addEventListener("click", () => { NV = b.dataset.nv; renderNerai(d); }));
}

// ---------- 脚質と展開のかたまり ----------

        <div class="fhorses">${c.map(h => `<span class="uma ${umaCls(h)}" title="${esc(h.name)}">${h.u}</span>`).join("") || '<span class="muted">-</span>'}</div>
      </div>`).join("")}

// ---------- 展開シミュレーション(ペースを選んで、レースの流れを画面で再現する) ----------
// 1) 各馬の位置取り:最近5走の脚質の割合(sr)から、その回の脚質をくじ引きで決め、少しぶれを足す
// 2) 着順:AI勝率(pw)を土台に、選んだペースが「AIの予想したペース」とどれだけ違うかで、前の馬・後ろの馬の強さを少し動かす
//    (AIの勝率は、予想どおりのペースになる前提の数字なので、予想と同じペースを選べば AIの勝率そのままになる)
// 3) 1角 → 向正面 → 3〜4角 → 直線 → ゴールで、位置取りを着順の方へ少しずつ入れかえて動かす
const TS_PACES = { S: "スロー", M: "平均", H: "ハイ" };
// ペースによる強さの上げ下げ(逃げ・先行・差し・追込の順。対数の単位)
// 検証56:2023〜2026年の平地1.24万レースで、実際のペース × 1コーナーの位置ごとに「勝ち数 ÷ オッズから見た勝ち数」を測った値(〜2025年と2026年で同じ向き)
const TS_PADJ = { S: [0.16, 0.09, -0.22, -0.31], M: [0, 0, 0, 0], H: [-0.20, -0.10, 0.11, 0.36] };
// 脚質1つぶんの差が何馬身か(縦長になりやすさ)。検証56:残り600mで追込の馬は先頭から スロー8.4 / 平均9.4 / ハイ10.9馬身うしろ
const TS_SPREAD = { S: 2.55, M: 2.85, H: 3.3 };
const TS_PHASE = [
  { t: 0.00, name: "スタート", mix: 0 },
  { t: 0.22, name: "1コーナー", mix: 0 },
  { t: 0.48, name: "向正面", mix: 0.05 },
  { t: 0.70, name: "3〜4コーナー", mix: 0.35 },
  { t: 0.86, name: "直線入口", mix: 0.65 },
  { t: 1.00, name: "ゴール", mix: 1 }
];
const TS_WAKU = ["#f2f2f2", "#222222", "#d63a2f", "#2f62c9", "#e8c531", "#2f9e4f", "#ee8a1f", "#f08fb5"];
const TS_WAKU_TX = ["#222", "#fff", "#fff", "#fff", "#222", "#fff", "#222", "#222"];
const TS_RIGHT = new Set(["札幌", "函館", "福島", "中山", "阪神", "京都", "小倉"]);
const TSIM = {};      // レースごとの状態(選んだペース・最後の1回・アニメの位置)

function tsWaku(u, n) {
  if (n <= 8) return u;
  const base = Math.floor(n / 8), extra = n % 8;
  let k = 0;
  for (let w = 1; w <= 8; w++) {
    k += base + (w > 8 - extra ? 1 : 0);
    if (u <= k) return w;
  }
  return 8;
}
function tsStyleProb(h) {
  if (h.sr && h.sr.some(v => v)) {
    const a = h.sr.map(v => (v || 0) + 0.15), t = a.reduce((x, y) => x + y, 0);
    return a.map(v => v / t);
  }
  if (h.st != null) { const a = [0.05, 0.05, 0.05, 0.05]; a[h.st] = 0.85; return a; }
  return [0.08, 0.30, 0.37, 0.25];
}
function tsInterp(arr, x) {                       // x(0〜3の位置)に合わせて、脚質ごとの値をなめらかにつなぐ
  const c = Math.max(0, Math.min(3, x)), i = Math.min(2, Math.floor(c)), f = c - i;
  return arr[i] * (1 - f) + arr[i + 1] * f;
}
function tsPredPace(r) {
  const pc = paceOf(r);
  return pc ? pc.short : "M";
}
const tsGumbel = () => -Math.log(-Math.log(Math.random() * 0.999999 + 0.0000005));

// 1回分のレースを作る(位置は「先頭から何馬身うしろか」で持つ)
function tsRunOnce(r, pace) {
  const hs = r.horses, n = hs.length, pred = tsPredPace(r);
  const spread = TS_SPREAD[pace];
  const H = hs.map((h, i) => {
    const sp = tsStyleProb(h);
    let x = Math.random(), s = 0;
    while (s < 3 && x > sp[s]) { x -= sp[s]; s++; }
    const ep = s + (Math.random() - 0.5) * 0.9 + (tsWaku(h.u, n) - 4.5) * 0.03;   // 内枠ほどわずかに前
    const adj = tsInterp(TS_PADJ[pace], ep) - tsInterp(TS_PADJ[pred], ep);
    const pw = (h.pw == null || isNaN(h.pw)) ? 1e-4 : Math.max(h.pw, 1e-4);
    return { i, u: h.u, s, ep, sc: Math.log(pw) + adj + tsGumbel() };
  });
  // 道中の隊列:脚質の位置(ep)の差 × 縦長さ
  const byEp = [...H].sort((a, b) => a.ep - b.ep);
  byEp.forEach(x => { x.mid = Math.max(0, x.ep - byEp[0].ep) * spread + Math.random() * 0.4; x.lane = 0; });
  // 同じくらいの位置の馬は外に並ぶ
  byEp.forEach((x, k) => {
    let lane = 0;
    for (let j = 0; j < k; j++) if (Math.abs(byEp[j].mid - x.mid) < 0.9 && byEp[j].lane === lane) lane++;
    x.lane = Math.min(lane, 4);
  });
  // ゴールの着差:強さの差を馬身に
  const byFin = [...H].sort((a, b) => b.sc - a.sc);
  let acc = 0;
  byFin.forEach((x, k) => {
    if (k) acc += Math.min(5, Math.max(0.1, (byFin[k - 1].sc - x.sc) * 1.3));
    x.fin = acc; x.rank = k + 1;
  });
  // 直線は外に持ち出す馬も出る
  byFin.forEach(x => { x.laneF = Math.min(7, x.lane + (x.s >= 2 ? 2 + Math.floor(Math.random() * 3) : Math.floor(Math.random() * 2))); });
  return { pace, H, byFin };
}
// 進み具合 t(0〜1)での位置(先頭から何馬身うしろか)と内外
function tsPosAt(run, t) {
  let k = 0;
  while (k < TS_PHASE.length - 2 && t > TS_PHASE[k + 1].t) k++;
  const a = TS_PHASE[k], b = TS_PHASE[k + 1];
  const f = Math.max(0, Math.min(1, (t - a.t) / (b.t - a.t)));
  const e = f * f * (3 - 2 * f);
  const startF = Math.min(1, t / TS_PHASE[1].t);        // スタート直後は横一線から広がる
  const out = run.H.map(x => {
    const m = a.mix + (b.mix - a.mix) * e;
    let beh = x.mid * (1 - m) + x.fin * m;
    if (t < TS_PHASE[1].t) beh *= startF * startF;
    const lane = t < TS_PHASE[1].t ? (tsWaku(x.u, run.H.length) - 1) * (1 - startF) + x.lane * startF
      : t < TS_PHASE[3].t ? x.lane : x.lane + (x.laneF - x.lane) * Math.min(1, (t - TS_PHASE[3].t) / (TS_PHASE[4].t - TS_PHASE[3].t));
    return { u: x.u, beh, lane };
  });
  const min = Math.min(...out.map(o => o.beh));
  out.forEach(o => { o.beh -= min; });
  return out;
}
// 1400m以下は向正面からのスタートで1コーナーがないので、呼び方を変える
function tsNames(r) {
  return (r.distance || 1600) <= 1400 ? ["スタート", "先行争い", "向正面", "3〜4コーナー", "直線入口", "ゴール"] : TS_PHASE.map(p => p.name);
}
function tsPhaseName(r, t) {
  let k = 0;
  TS_PHASE.forEach((p, i) => { if (t >= p.t - 0.02) k = i; });
  return tsNames(r)[k];
}
// 隊列を新聞の展開図のような文字にする(1馬身以内はひとかたまり)
function tsLine(pos, th = 1.0) {
  const s = [...pos].sort((a, b) => a.beh - b.beh || a.lane - b.lane);
  const groups = [];
  s.forEach((o, k) => {
    if (k && o.beh - s[k - 1].beh <= th) groups[groups.length - 1].push(o.u);
    else groups.push([o.u]);
  });
  return groups.map(g => g.length > 1 ? `(${g.join(",")})` : `${g[0]}`).join(" ・ ");
}

  return `<div class="tsim">

      <span class="muted">AIの予想ペース:<b>${TS_PACES[pred]}</b>${r.nk ? ` ・ netkeiba(nk)の予想:<b>${TS_PACES[r.nk] || esc(r.nk)}</b>` : ""}</span></div>
    <div class="tsbar">
      <div class="seg" role="group" aria-label="ペース">${["S", "M", "H"].map(p => `<button type="button" class="tsPace ${st.pace === p ? "on" : ""}" data-p="${p}">${TS_PACES[p]}${p === pred ? "(AI)" : ""}${p === r.nk ? "(nk)" : ""}</button>`).join("")}</div>
      <button class="primary" type="button" id="tsGo">走らせる</button>
      <button type="button" id="tsSpeed" title="再生の速さ">×1</button>
      <button type="button" id="tsView" title="表示の切り替え">${st.view === "strip" ? "コース表示にする" : "横一列表示にする"}</button>
    </div>
    <div class="tsstage">
      <svg id="tsOval" viewBox="0 0 220 120" aria-label="コース全体の中の、今の位置"></svg>
      <div class="tsinfo"><div id="tsPhase" class="tsphase">スタート前</div><div id="tsRemain" class="muted"></div></div>
    </div>
    <svg id="tsStrip" class="tsstrip" viewBox="0 0 640 170" aria-label="隊列"></svg>
    <div id="tsSnap" class="tssnap"></div>
    <div class="tsbar"><button type="button" id="tsMany">ペース別の勝率を比べる(各2万回)</button></div>
    <div id="tsTable"></div>
    <div class="muted">走らせるたびに、くじ引きで違う展開になります(1回分の例)。位置取りは最近5走の脚質の割合から、着順はAI勝率をもとに、選んだペースが予想と違うときだけ前の馬・後ろの馬の強さを動かしています。予想ペースを選ぶと、勝率はAI勝率と同じになります。上げ下げの大きさと隊列の開きは、過去1.24万レースから測った数字です(検証56:たとえばハイペースになると追込は勝ちが1.4倍、逃げは0.8倍)。ただしペースはレース前には分からず、検証(㊱)では展開の向き不向きはオッズにほぼ織り込み済みでした。<b>買い目を決めるものではなく、レースの流れをイメージするための道具</b>です。</div>
  </div>`;
}

function initTenkaiSim(r) {
  if (!$("tsGo")) return;
  const st = TSIM[r.id];
  st.speed = st.speed || 1;
  document.querySelectorAll(".tsPace").forEach(b => b.addEventListener("click", () => {
    st.pace = b.dataset.p;
    document.querySelectorAll(".tsPace").forEach(x => x.classList.toggle("on", x === b));
    tsPlay(r);
  }));
  $("tsGo").addEventListener("click", () => tsPlay(r));
  $("tsSpeed").textContent = "×" + st.speed;
  $("tsSpeed").addEventListener("click", () => { st.speed = st.speed === 1 ? 2 : st.speed === 2 ? 4 : 1; $("tsSpeed").textContent = "×" + st.speed; });
  $("tsMany").addEventListener("click", () => tsMany(r));
  $("tsView").addEventListener("click", () => {
    st.view = st.view === "strip" ? "track" : "strip";
    $("tsView").textContent = st.view === "strip" ? "コース表示にする" : "横一列表示にする";
    tsDraw(r, st.run || null, st.run ? (st.tNow == null ? 1 : st.tNow) : 0);
  });
  tsDrawOval(r, 0, null);
  if (st.run) { tsDraw(r, st.run, 1); tsSnap(r, st.run); } else tsDraw(r, null, 0);
  if (st.table) $("tsTable").innerHTML = st.table;
}

function tsPlay(r) {
  const st = TSIM[r.id];
  cancelAnimationFrame(st.raf);
  const run = tsRunOnce(r, st.pace);
  st.run = run;
  $("tsSnap").innerHTML = "";
  const DUR = 14000;
  let last = performance.now(), t = 0;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { tsDraw(r, run, 1); tsSnap(r, run); return; }
  const frame = now => {
    if (!$("tsStrip")) return;                         // 別のレースを開いたら止める
    t = Math.min(1, t + (now - last) / DUR * st.speed);
    last = now;
    tsDraw(r, run, t);
    if (t < 1) st.raf = requestAnimationFrame(frame);
    else tsSnap(r, run);
  };
  st.raf = requestAnimationFrame(frame);
}

function tsDrawOval(r, t, run) {
  const svg = $("tsOval");
  if (!svg) return;
  const right = TS_RIGHT.has(r.venue);
  const cx = 110, cy = 60, L = 120, R = 38;                 // 直線の長さとカーブの半径
  const per = 2 * L + 2 * Math.PI * R;
  const pt = p => {                                          // 周の上の点(p は 0〜1。0 はゴール板)
    let d = ((p % 1) + 1) % 1 * per, x, y;
    if (d < L / 2) { x = cx + d; y = cy + R; }              // ホームストレッチ(ゴール板から先)
    else if ((d -= L / 2) < Math.PI * R) { const a = d / R; x = cx + L / 2 + R * Math.sin(a); y = cy + R * Math.cos(a); }
    else if ((d -= Math.PI * R) < L) { x = cx + L / 2 - d; y = cy - R; }
    else if ((d -= L) < Math.PI * R) { const a = d / R; x = cx - L / 2 - R * Math.sin(a); y = cy - R * Math.cos(a); }
    else { d -= Math.PI * R; x = cx - L / 2 + d; y = cy + R; }
    if (right) x = 2 * cx - x;                               // 上から見て右回りは時計回り(スタンド前の直線を右から左へ走る)
    return [x, y];
  };
  // 周の長さを 1800m とみなし、ゴール板の手前「距離」ぶんの所をスタートにする(左回り・右回りで向きを合わせる)
  const lap = 1800, dist = r.distance || 1600;
  const pOf = (tt, behLen) => -(dist * (1 - tt) + behLen * 2.4) / lap;
  let path = "";
  for (let k = 0; k <= 120; k++) { const [x, y] = pt(k / 120); path += (k ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1); }
  const [gx, gy] = pt(0);
  let dots = "";
  if (run) {
    tsPosAt(run, t).forEach(o => {
      const [x, y] = pt(pOf(t, o.beh));
      const w = tsWaku(o.u, run.H.length) - 1;
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${TS_WAKU[w]}" stroke="var(--ink)" stroke-width=".5"/>`;
    });
  } else {
    const [sx, sy] = pt(pOf(0, 0));
    dots = `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="3.5" fill="var(--gold)"/><text x="${sx.toFixed(1)}" y="${(sy - 6).toFixed(1)}" class="tslab" text-anchor="middle">スタート</text>`;
  }
  svg.innerHTML = `<path d="${path}Z" fill="none" stroke="var(--turf-soft)" stroke-width="12"/>
    <path d="${path}Z" fill="none" stroke="var(--turf)" stroke-width="1" opacity=".5"/>
    <line x1="${gx}" y1="${gy - 8}" x2="${gx}" y2="${gy + 8}" stroke="var(--bad)" stroke-width="2"/>
    <text x="${gx}" y="${gy + 18}" class="tslab" text-anchor="middle">ゴール</text>
    <text x="${cx}" y="${cy + 4}" class="tslab" text-anchor="middle">${esc(r.venue)}${esc(r.surface || "")}${r.distance ? r.distance + "m" : ""}・${right ? "右回り" : "左回り"}</text>${dots}`;
}

// ===== コース表示:JRAの中継の隊列図のように、コースの形にそって馬を置く(コーナーでは斜め〜縦に並ぶ) =====
// 位置の決め方は小さいコース図と同じ(1周1800m・1馬身2.4m)。画面は馬群を追いかけて拡大する
const TS_LAP = 1800, TS_BL = 2.4, TS_LANE = 2.3, TS_TW = 20;   // 1周・1馬身・1頭ぶんの横幅・コースの幅(m)
// 荒れ指数ごとの、過去(2024〜2026年・約1万レース)の三連複1万円以上の割合
const ARE_RATE = [10, 20, 32, 40, 55];
// 荒れ指数ごとの配当の分布(2024〜2026年・学習に使っていない約1万レース)。sf=三連複の配当帯の割合%、q=三連複の25/50/75%点、ur/st=馬連・三連単の配当の真ん中、fw/f3=1番人気の勝率・3着内率%、wp=勝ち馬の人気(1/2-3/4-6/7〜)の割合%
const ARE_DIST = {"1": {"n": 2065, "sf": [37.7, 30.1, 22.2, 8.5, 0.7, 0.8], "q": [660, 1480, 4120], "ur": 780, "st": 7090, "fw": 43.1, "f3": 78.7, "wp": [43.1, 36.8, 16.8, 3.3]}, "2": {"n": 1957, "sf": [15.8, 35.4, 29.1, 15.8, 2.1, 1.7], "q": [1420, 2930, 7590], "ur": 1290, "st": 15380, "fw": 38.5, "f3": 71.1, "wp": [38.5, 34.0, 19.9, 7.6]}, "3": {"n": 1925, "sf": [5.9, 30.5, 31.6, 24.3, 4.2, 3.5], "q": [2120, 4690, 14150], "ur": 1800, "st": 25470, "fw": 32.6, "f3": 65.5, "wp": [32.6, 34.5, 21.0, 11.9]}, "4": {"n": 2106, "sf": [2.4, 22.9, 34.8, 29.5, 4.8, 5.5], "q": [2962, 7210, 18862], "ur": 2235, "st": 36930, "fw": 30.4, "f3": 61.5, "wp": [30.4, 31.2, 22.7, 15.6]}, "5": {"n": 1922, "sf": [0.5, 10.1, 34.9, 37.9, 8.7, 7.9], "q": [5182, 11475, 31162], "ur": 3290, "st": 63720, "fw": 23.8, "f3": 52.2, "wp": [23.8, 28.4, 23.6, 24.1]}};
const ARE_BANDS = ["〜1千円", "1千〜3千", "3千〜1万", "1万〜5万", "5万〜10万", "10万円〜"];
const ARE_COL = ["#3f8f5f", "#7fb08a", "#c9b458", "#d98a3a", "#c2412d", "#8f1d1d"];
function areDistBlock(lv) {
  const d = ARE_DIST[lv];
  if (!d) return "";
  const bar = d.sf.map((v, i) => `<i style="width:${v}%;background:${ARE_COL[i]}" title="${ARE_BANDS[i]} ${v}%"></i>`).join("");
  const leg = d.sf.map((v, i) => `<span style="white-space:nowrap"><b style="color:${ARE_COL[i]}">■</b>${ARE_BANDS[i]} ${v}%</span>`).join(" ");
  return `<div class="aredist"><b style="font-size:13px">荒れ指数${lv}のレースの三連複の配当(過去${d.n.toLocaleString()}レース)</b>
    <div class="arebar">${bar}</div><div class="muted" style="display:flex;flex-wrap:wrap;gap:4px 10px">${leg}</div>
    <div class="muted">三連複 真ん中 <b>${d.q[1].toLocaleString()}円</b>(4分の1が${d.q[0].toLocaleString()}円以下・4分の1が${d.q[2].toLocaleString()}円以上) ・ 馬連 真ん中 ${d.ur.toLocaleString()}円 ・ 三連単 真ん中 ${d.st.toLocaleString()}円<br>
    1番人気 勝率${d.fw}%・3着内${d.f3}% ・ 勝ち馬の人気 1番人気${d.wp[0]}% / 2〜3番人気${d.wp[1]}% / 4〜6番人気${d.wp[2]}% / 7番人気以下${d.wp[3]}%</div></div>`;
}
function tsGeom(right) {
  const L = 450, R = (TS_LAP - 2 * L) / (2 * Math.PI);
  const pt = p => {                                         // 内ラチの上の点(p は 0〜1。0 はゴール板)
    let d = ((p % 1) + 1) % 1 * TS_LAP, x, y;
    if (d < L / 2) { x = d; y = R; }
    else if ((d -= L / 2) < Math.PI * R) { const a = d / R; x = L / 2 + R * Math.sin(a); y = R * Math.cos(a); }
    else if ((d -= Math.PI * R) < L) { x = L / 2 - d; y = -R; }
    else if ((d -= L) < Math.PI * R) { const a = d / R; x = -L / 2 - R * Math.sin(a); y = -R * Math.cos(a); }
    else { d -= Math.PI * R; x = -L / 2 + d; y = R; }
    if (right) x = -x;                                      // 右回りは時計回り
    return [x, y];
  };
  const out = (x, y) => {                                   // 外側に向かう向き
    const qx = Math.max(-L / 2, Math.min(L / 2, x)), dx = x - qx, dy = y, n = Math.hypot(dx, dy) || 1;
    return [dx / n, dy / n];
  };
  const at = (p, off) => { const [x, y] = pt(p), [nx, ny] = out(x, y); return [x + nx * off, y + ny * off]; };
  return { pt, out, at };
}
function tsDrawTrack(r, run, t, svg) {
  const G = tsGeom(TS_RIGHT.has(r.venue));
  const dist = r.distance || 1600, AR = 640 / 170;
  const pOf = (tt, beh) => -(dist * (1 - tt) + beh * TS_BL) / TS_LAP;
  // 馬の位置
  const pos = run ? tsPosAt(run, t).map(o => {
    const [x, y] = G.at(pOf(t, o.beh), 1.4 + o.lane * TS_LANE);
    return { ...o, x, y };
  }) : [];
  // カメラ:馬群がおさまるように、まわりを少し空けて拡大
  const ref = pos.length ? pos : [{ x: G.at(pOf(0, 0), 8)[0], y: G.at(pOf(0, 0), 8)[1] }];
  const xs = ref.map(o => o.x), ys = ref.map(o => o.y);
  const mx = (Math.min(...xs) + Math.max(...xs)) / 2, my = (Math.min(...ys) + Math.max(...ys)) / 2;
  const w = Math.max(70, Math.max(...xs) - Math.min(...xs) + 26, (Math.max(...ys) - Math.min(...ys) + 26) * AR), h = w / AR;
  svg.setAttribute("viewBox", `${(mx - w / 2).toFixed(2)} ${(my - h / 2).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)}`);
  const u = w / 640;                                        // 画面の1px が何mか
  const rr = Math.max(1.25, 9 * u), fs = Math.max(1.5, 10 * u), ls = 11 * u;
  // コース(芝の帯・内ラチ・外ラチ)を、見えている所だけ細かく描く
  const line = off => { let s = ""; for (let k = 0; k <= 720; k++) { const [x, y] = G.at(k / 720, off); s += (k ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1); } return s + "Z"; };
  let g = `<path d="${line(TS_TW / 2)}" fill="none" stroke="var(--card)" stroke-opacity=".55" stroke-width="${TS_TW}"/>

    <path d="${line(TS_TW)}" fill="none" stroke="var(--ink)" stroke-opacity=".5" stroke-width="${(1 * u).toFixed(2)}"/>`;
  // 残り距離の目印とゴール板
  for (let m = 200; m < Math.min(dist, TS_LAP - 100); m += 200) {      // 1周より長いレースは、ゴール前の1周ぶんだけ
    const [x1, y1] = G.at(-m / TS_LAP, 0), [x2, y2] = G.at(-m / TS_LAP, -3), [x3, y3] = G.at(-m / TS_LAP, -7);
    g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--muted)" stroke-width="${(1 * u).toFixed(2)}"/>
      <text x="${x3}" y="${y3}" style="font-size:${ls}px" class="tslab" text-anchor="middle" dominant-baseline="middle">${m}</text>`;
  }
  { const [x1, y1] = G.at(0, -2), [x2, y2] = G.at(0, TS_TW + 2), [x3, y3] = G.at(0, TS_TW + 6);
    g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--bad)" stroke-width="${(2.5 * u).toFixed(2)}"/>
      <text x="${x3}" y="${y3}" style="font-size:${ls}px" class="tslab" text-anchor="middle" dominant-baseline="middle">ゴール</text>`; }
  if (!run) {

    g += `<text x="${x}" y="${y}" style="font-size:${ls}px" class="tslab" text-anchor="middle">スタート(「走らせる」を押すと馬が出ます)</text>`;
    svg.innerHTML = g;
    return;
  }
  const axis = r.axis, himo = r.himo || [];

    const wk = tsWaku(o.u, run.H.length) - 1;
    const ring = o.u === axis ? "var(--turf)" : himo.includes(o.u) ? "var(--gold)" : "var(--ink)";
    const rw = (o.u === axis || himo.includes(o.u) ? 2.5 : 0.8) * u;
    g += `<g><circle cx="${o.x.toFixed(2)}" cy="${o.y.toFixed(2)}" r="${rr.toFixed(2)}" fill="${TS_WAKU[wk]}" stroke="${ring}" stroke-width="${rw.toFixed(2)}"/>

    if (t >= 1 && res[o.u].rank <= 3) {
      const [nx, ny] = G.out(o.x, o.y);
      g += `<text x="${(o.x + nx * rr * 2.4).toFixed(2)}" y="${(o.y + ny * rr * 2.4).toFixed(2)}" style="font-size:${(11 * u).toFixed(2)}px" class="tsrank" text-anchor="middle" dominant-baseline="central">${res[o.u].rank}着</text>`;
    }
    g += `</g>`;
  });
  svg.innerHTML = g;
}

function tsDraw(r, run, t) {
  const svg = $("tsStrip");
  if (!svg) return;
  tsDrawOval(r, t, run);
  const W = 640, Hh = 170, top = 26, laneH = 16, padR = 40;
  const dist = r.distance || 1600;
  $("tsPhase").textContent = run ? tsPhaseName(r, t) : "スタート前";
  $("tsRemain").textContent = run ? (t < 1 ? `残り ${Math.max(0, Math.round(dist * (1 - t) / 50) * 50)}m` : `${TS_PACES[run.pace]}ペースの1回分`) : `${TS_PACES[TSIM[r.id].pace]}ペースで走らせます`;
  const stv = TSIM[r.id];
  stv.tNow = t;
  if (stv.view !== "strip") { tsDrawTrack(r, run, t, svg); return; }
  svg.setAttribute("viewBox", "0 0 640 170");
  if (!run) {
    svg.innerHTML = `<text x="${W / 2}" y="${Hh / 2}" class="tslab" text-anchor="middle">「走らせる」を押すと、ここに隊列が出ます(${TS_RIGHT.has(r.venue) ? "右回りなので左が前" : "左回りなので右が前"})</text>`;
    return;
  }
  const pos = tsPosAt(run, t);
  const maxB = Math.max(12, ...pos.map(o => o.beh)) + 1.5;
  const rv = TS_RIGHT.has(r.venue);                  // 右回りはスタンド前を右から左へ走るので左が前、左回りは右が前
  const sx = b => rv ? padR + b / maxB * (W - padR - 30) : W - padR - b / maxB * (W - padR - 30);
  let g = "";
  for (let b = 0; b <= maxB; b += maxB > 30 ? 10 : 5) {
    const x = sx(b);
    g += `<line x1="${x}" y1="${top - 6}" x2="${x}" y2="${Hh - 8}" stroke="var(--line)"/><text x="${x}" y="${top - 10}" class="tslab" text-anchor="middle">${b ? b + "馬身" : "先頭"}</text>`;
  }
  const lx = rv ? W - 10 : 10, la = rv ? "end" : "start";
  g += `<text x="${lx}" y="${top + 4}" class="tslab" text-anchor="${la}">内</text><text x="${lx}" y="${Hh - 12}" class="tslab" text-anchor="${la}">外</text>`;
  const axis = r.axis, himo = r.himo || [];
  const res = run.H.reduce((m, x) => (m[x.u] = x, m), {});
  pos.sort((a, b) => b.lane - a.lane).forEach(o => {
    const x = sx(o.beh), y = top + 6 + o.lane * laneH;
    const w = tsWaku(o.u, run.H.length) - 1;
    const ring = o.u === axis ? "var(--turf)" : himo.includes(o.u) ? "var(--gold)" : "var(--ink)";
    const rw = o.u === axis || himo.includes(o.u) ? 2.5 : 0.8;
    g += `<g><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="${TS_WAKU[w]}" stroke="${ring}" stroke-width="${rw}"/>
      <text x="${x.toFixed(1)}" y="${(y + 3.5).toFixed(1)}" class="tsnum" text-anchor="middle" fill="${TS_WAKU_TX[w]}">${o.u}</text>
      ${t >= 1 && res[o.u].rank <= 3 ? `<text x="${(x + (rv ? -13 : 13)).toFixed(1)}" y="${(y + 4).toFixed(1)}" class="tsrank" text-anchor="${rv ? "end" : "start"}">${res[o.u].rank}着</text>` : ""}</g>`;
  });
  svg.innerHTML = g;
}

function tsMany(r) {
  const N = 20000, n = r.horses.length;
  const btn = $("tsMany"); btn.disabled = true; btn.textContent = "回しています…";
  setTimeout(() => {
    const out = {};
    ["S", "M", "H"].forEach(p => {
      const w = new Float64Array(n), t3 = new Float64Array(n);
      let hit = 0;
      const buy = new Set((r.combos || []).map(cb => cb.c.join("-")));
      for (let k = 0; k < N; k++) {
        const run = tsRunOnce(r, p);
        w[run.byFin[0].i]++;
        for (let j = 0; j < 3; j++) t3[run.byFin[j].i]++;
        if (buy.size && buy.has(run.byFin.slice(0, 3).map(x => x.u).sort((a, b) => a - b).join("-"))) hit++;
      }
      out[p] = { w, t3, hit: buy.size ? hit / N : null };
    });
    const pred = tsPredPace(r);
    const cell = (v, base) => {
      const d = v - base, cls = d > 0.02 ? "good" : d < -0.02 ? "bad" : "";
      return `<td class="num ${cls}">${pct(v)}</td>`;
    };
    const rows = r.horses.map((h, i) => ({ h, i })).sort((a, b) => out[pred].w[b.i] - out[pred].w[a.i]);
    const html = `<div class="tblwrap"><table><thead>
      <tr><th rowspan="2">馬番</th><th class="l" rowspan="2">馬名</th><th rowspan="2">脚質</th><th colspan="3">勝率</th><th colspan="3">3着内率</th></tr>
      <tr>${["S", "M", "H"].map(p => `<th>${TS_PACES[p]}${p === pred ? "*" : ""}</th>`).join("")}${["S", "M", "H"].map(p => `<th>${TS_PACES[p]}${p === pred ? "*" : ""}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(({ h, i }) => `<tr class="${h.u === r.axis ? "isax" : (r.himo || []).includes(h.u) ? "isww" : ""}"><td class="num">${h.u}</td><td class="l">${esc(h.name)}</td><td>${stChip(h.st)}</td>
        ${["S", "M", "H"].map(p => cell(out[p].w[i] / N, out[pred].w[i] / N)).join("")}
        ${["S", "M", "H"].map(p => cell(out[p].t3[i] / N, out[pred].t3[i] / N)).join("")}</tr>`).join("")}</tbody></table></div>
      ${(r.combos || []).length ? `<div class="muted">三連複の買い目が当たる割合:${["S", "M", "H"].map(p => `${TS_PACES[p]} <b>${pct(out[p].hit)}</b>`).join(" / ")}</div>` : ""}
      <div class="muted">*は予想ペース。予想ペースより2ポイント以上上がった数字は緑、下がった数字は赤です。</div>`;
    TSIM[r.id].table = html;
    $("tsTable").innerHTML = html;
    btn.disabled = false; btn.textContent = "ペース別の勝率を比べる(もう一度)";
  }, 30);
}

function prep(r) {
  const p = r.horses.map(h => (h.pw == null || isNaN(h.pw)) ? 1e-9 : Math.max(h.pw, 1e-9));
  const s = p.reduce((a, b) => a + b, 0);
  const norm = a => { const t = a.reduce((x, y) => x + y, 0); return a.map(v => v / t); };
  const p1 = p.map(v => v / s);
  return { p1, q2: norm(p1.map(v => Math.pow(v, DATA.l2))), q3: norm(p1.map(v => Math.pow(v, DATA.l3))) };
}
function pick(w, ex1, ex2) {
  let tot = 0;
  for (let i = 0; i < w.length; i++) if (i !== ex1 && i !== ex2) tot += w[i];
  let x = Math.random() * tot;
  for (let i = 0; i < w.length; i++) {
    if (i === ex1 || i === ex2) continue;
    x -= w[i]; if (x <= 0) return i;
  }
  for (let i = w.length - 1; i >= 0; i--) if (i !== ex1 && i !== ex2) return i;
}
function runOnce(r) {
  const { p1, q2, q3 } = prep(r);
  const a = pick(p1, -1, -1), b = pick(q2, a, -1), c = pick(q3, a, b);
  const U = [a, b, c].map(i => r.horses[i]);
  const key = U.map(h => h.u).sort((x, y) => x - y).join("-");
  const hit = r.combos.find(cb => cb.c.join("-") === key);
  $("once").innerHTML = `<div class="once">1着 ${U[0].u} ${esc(U[0].name)}<br>2着 ${U[1].u} ${esc(U[1].name)}<br>3着 ${U[2].u} ${esc(U[2].name)}<br>
    <span class="${hit ? "good" : "muted"}" style="font-size:14px">${r.combos.length ? (hit ? `三連複 ${key} 的中${hit.odds ? `(${hit.odds}倍)` : ""}` : "三連複は外れ") : "このレースは買わない"}</span></div>`;
}
function runSim(r) {
  const N = +$("simN").value;
  const { p1, q2, q3 } = prep(r);
  const n = r.horses.length;
  const c1 = new Float64Array(n), c2 = new Float64Array(n), c3 = new Float64Array(n);
  const combo = new Map(), uren = new Map();
  const buy = new Map(r.combos.map((cb, i) => [cb.c.join("-"), i]));
  const buyHit = new Float64Array(r.combos.length);
  let done = 0, raceHit = 0;
  const btn = $("btnSim"); btn.disabled = true;
  const step = () => {
    const end = Math.min(N, done + 20000);
    for (; done < end; done++) {
      const a = pick(p1, -1, -1), b = pick(q2, a, -1), c = pick(q3, a, b);
      c1[a]++; c2[a]++; c2[b]++; c3[a]++; c3[b]++; c3[c]++;
      const k = [r.horses[a].u, r.horses[b].u, r.horses[c].u].sort((x, y) => x - y).join("-");
      combo.set(k, (combo.get(k) || 0) + 1);
      const k2 = r.horses[a].u < r.horses[b].u ? r.horses[a].u + "-" + r.horses[b].u : r.horses[b].u + "-" + r.horses[a].u;
      uren.set(k2, (uren.get(k2) || 0) + 1);
      const bi = buy.get(k);
      if (bi !== undefined) { buyHit[bi]++; raceHit++; }
    }
    btn.textContent = `回しています… ${Math.round(done / N * 100)}%`;
    if (done < N) { setTimeout(step, 0); return; }
    btn.disabled = false; btn.textContent = "もう一度回す";
    showSim(r, N, c1, c2, c3, combo, uren, buyHit, raceHit);
  };
  step();
}
function showSim(r, N, c1, c2, c3, combo, uren, buyHit, raceHit, replay) {
  document.querySelectorAll("#htbl tbody tr").forEach((tr, i) => {
    tr.querySelector("td.sim1").textContent = pct(c1[i] / N);
    tr.querySelector("td.sim2").textContent = pct(c2[i] / N);
    tr.querySelector("td.sim3").textContent = pct(c3[i] / N);
  });
  const rows = r.combos.map((cb, i) => {
    const p = buyHit[i] / N, a = adjP(p, cb.odds, "sfuku");
    return { k: cb.c.join("-"), p, odds: cb.odds, pa: a.pa };
  });
  const withOdds = rows.filter(x => x.odds && x.pa != null);
  const ev = withOdds.length ? withOdds.reduce((s, x) => s + x.pa * x.odds, 0) / withOdds.length : null;
  LASTSIM[r.id] = { N, combo, uren, args: [N, c1, c2, c3, combo, uren, buyHit, raceHit] };
  $("simOut").innerHTML = `
    <div class="tiles">
      <div class="tile"><span class="k">${N.toLocaleString()}回のうち、買い目が当たった割合</span><span class="v">${r.combos.length ? pct(raceHit / N) : "-"}</span></div>
      <div class="tile"><span class="k">買い目の点数</span><span class="v">${r.combos.length}点</span></div>
      <div class="tile"><span class="k">100円あたりの期待値(控えめ・オッズがある分)</span><span class="v ${ev == null ? "" : ev >= 1 ? "good" : "bad"}">${ev == null ? "-" : ev.toFixed(2)}</span></div>
    </div>
    ${rows.length ? `<div class="tblwrap"><table><thead><tr><th class="l">三連複の買い目</th><th>当たる確率</th><th>オッズ</th><th>期待値(控えめ)</th></tr></thead><tbody>
      ${rows.sort((a, b) => b.p - a.p).map(x => `<tr><td class="l num">${x.k}</td><td class="num">${pct(x.p, 2)}</td><td class="num">${x.odds ? x.odds.toFixed(1) : "-"}</td>
        <td class="num ${x.pa != null ? (x.pa * x.odds >= 1 ? "good" : "bad") : ""}">${x.pa != null ? (x.pa * x.odds).toFixed(2) : "-"}</td></tr>`).join("")}
    </tbody></table></div>` : ""}
    <div id="comboBox"></div>`;
  renderCombos(r);
  if (replay) { renderHist(r); return; }
  (HIST[r.id] = HIST[r.id] || []).unshift({ N, hit: r.combos.length ? raceHit / N : null, ev, at: new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) });
  HIST[r.id] = HIST[r.id].slice(0, 6);
  renderHist(r);
}
// ---------- 期待値を控えめにする ----------
// ㉛の検証で、AIがオッズより「1.5〜2倍来る」と見た馬でも、実際はオッズより0〜6%多く来ただけだった。
// なので、シミュレーションの的中率をそのまま使わず、オッズから見た的中率(払戻率 ÷ オッズ)に寄せてから期待値を出す。
//   控えめな的中率 = オッズの的中率 × (シミュレーション ÷ オッズの的中率) ^ W   (W = 0.2:AIの言うずれの2割だけ信じる)
// オッズの3倍以上ずれている組み合わせは「ずれすぎ」として、期待値順から外す。
const SHRINK_W = 0.2, TOO_FAR = 3;
const PAY_RATE = { uren: 0.775, sfuku: 0.75 };
function adjP(p, odds, bet) {
  if (!odds || !p) return { pa: null, pm: null, ratio: null };
  const pm = PAY_RATE[bet] / odds;
  const ratio = p / pm;
  return { pa: pm * Math.pow(ratio, SHRINK_W), pm, ratio };
}

// ---------- 馬連・三連複:シミュレーションの的中率 × オッズ = 期待値 ----------
const LASTSIM = {};
let CB = { bet: "uren", sort: "p" };
function renderCombos(r) {
  const box = $("comboBox"), S = LASTSIM[r.id];
  if (!box || !S) return;
  const isU = CB.bet === "uren";
  const counts = isU ? S.uren : S.combo, oddsMap = (isU ? r.uo : r.so) || {};
  const buys = isU ? new Set() : buyKeys(r);
  let rows = [...counts.entries()].map(([k, v]) => {
    const p = v / S.N, o = oddsMap[k] ?? (isU ? null : (r.combos.find(c => c.c.join("-") === k) || {}).odds) ?? null;
    const { pa, pm, ratio } = adjP(p, o, CB.bet);
    return { k, p, o, pm, ratio, raw: o ? p * o : null, ev: pa != null ? pa * o : null, far: ratio != null && (ratio >= TOO_FAR || ratio <= 1 / TOO_FAR) };
  });
  const MINP = 0.003;                                                  // 期待値順は、0.3%未満(回数が少なくぶれが大きい)を外す
  if (CB.sort === "ev") rows = rows.filter(x => x.ev != null && x.p >= MINP && !x.far).sort((a, b) => b.ev - a.ev);
  else rows.sort((a, b) => b.p - a.p);
  rows = rows.slice(0, 15);
  const nOdds = Object.keys(oddsMap).length;
  const btn = (key, val, label) => `<button type="button" class="${CB[key] === val ? "primary" : ""}" data-k="${key}" data-v="${val}" style="padding:6px 10px">${label}</button>`;
  box.innerHTML = `<div style="display:grid;gap:8px">
    <div class="simbar">${btn("bet", "uren", "馬連")}${btn("bet", "sfuku", "三連複")}<span class="muted" style="margin:0 4px">|</span>${btn("sort", "p", "出やすい順")}${btn("sort", "ev", "期待値順")}</div>
    ${!nOdds ? `<div class="muted">このファイルには${isU ? "馬連" : "三連複"}のオッズが入っていないので、期待値は出せません(新しい形で「予想し直す」を押すと入ります)。</div>` : ""}
    ${rows.length ? `<div class="tblwrap"><table><thead><tr><th class="l">${isU ? "馬連" : "三連複"}</th><th>的中率<br>(シミュ)</th><th>的中率<br>(オッズ)</th><th>オッズ</th><th>期待値<br>(控えめ)</th><th>元の<br>期待値</th></tr></thead><tbody>
      ${rows.map(x => `<tr><td class="l num">${x.k}${buys.has(x.k) ? ' <span class="chip ww">買い目</span>' : ""}${x.far ? ' <span class="chip jump">ずれすぎ</span>' : ""}</td><td class="num">${pct(x.p, 2)}</td>
        <td class="num muted">${x.pm != null ? pct(x.pm, 2) : "-"}</td>
        <td class="num">${x.o ? x.o.toFixed(1) : "-"}</td><td class="num ${x.ev == null ? "" : x.ev >= 1 ? "good" : "bad"}"><b>${x.ev == null ? "-" : x.ev.toFixed(2)}</b></td>
        <td class="num muted">${x.raw == null ? "-" : x.raw.toFixed(2)}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="muted">${CB.sort === "ev" ? "オッズがあって的中率0.3%以上の組み合わせがありません" : "まだありません"}</div>`}
    <div class="muted">「期待値(控えめ)」は、シミュレーションの的中率をそのまま使わず、オッズから見た的中率(払戻率 ÷ オッズ)に寄せてから出しています。過去3年半の検証で、AIがオッズと食い違うとき、実際に当たっていたのはそのずれの1〜2割ほどだったためです(AIの言うずれの2割だけを信じる計算)。「元の期待値」は寄せる前の数字です。</div>
    <div class="muted">シミュレーションとオッズが3倍以上ずれている組み合わせには「ずれすぎ」が付き、期待値順からは外れます。外れているのはたいていAIの方です。${isU ? "" : "三連複のオッズは、AI複勝率から見て出やすい150通りと買い目の分だけ入れています。"}期待値順は的中率0.3%以上だけを並べています。朝の「予想」のときのオッズは、まだ売れている数が少なくて極端に高いことがあるので、期待値は発走直前の「予想し直す」のあとに見てください。</div>
  </div>`;
  box.querySelectorAll("button[data-k]").forEach(b => b.addEventListener("click", () => { CB[b.dataset.k] = b.dataset.v; renderCombos(r); }));
}
function buyKeys(r) { return new Set(r.combos.map(cb => cb.c.join("-"))); }
function renderHist(r) {
  const h = HIST[r.id] || [];
  $("hist").innerHTML = h.length ? `<b style="font-size:13px">回した記録(このレース)</b>` + h.map(x =>
    `<div class="num">${x.at} ・ ${x.N.toLocaleString()}回 ・ 的中 ${x.hit == null ? "-" : pct(x.hit, 2)} ・ 期待値 ${x.ev == null ? "-" : x.ev.toFixed(2)}</div>`).join("") : "";
}

// ---------- 起動:前回の読み込み → 見本 ----------
(() => {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("keiba_app_data") || "null"); } catch (e) {}
  setData(saved || SAMPLE, saved ? `前回読み込んだ予想を表示しています(${saved.made})。最新を読み込んでいます` : "");
  loadDrive();
  setInterval(() => { if (document.visibilityState === "visible") loadDrive(); }, 120000);   // 2分ごとに自動で最新に
})();

</script>
